# SPDX-License-Identifier: MIT
#
# The point of this workflow is the platforms that cannot be run while building
# GoScheme on Linux: macOS in particular, where there is no way to execute a
# Mach-O binary, and Windows and Linux arm64, which used to be compile-only.
# Everything here runs the suites natively, and the macOS jobs also build the
# cgo flavour, which is the one with (goscheme ffi).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-amd64, os: macos-13 }
          - { name: darwin-arm64, os: macos-14 }
          - { name: windows-amd64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # The unit tests, which include running every extension suite and every
      # example.
      - name: go test
        run: go test ./...

      # And again through the command line interpreter, so that the driver part
      # is exercised too.
      - name: build
        run: go build -trimpath -ldflags "-s -w" -o goscheme ./cmd/goscheme

      - name: suites
        shell: bash
        run: |
          set -e
          for s in r7rs goscheme concurrency network process data match; do
            printf '%-12s ' "$s"
            ./goscheme "test/scheme/run-$s.scm" | tail -1
          done

      - name: examples
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The process and pipe examples need a POSIX shell; the runner
            # script does too, so the portable examples are run one by one.
            for f in numbers recursion hash-tables concurrency script-args json regexp time fs match tcp-server http-server; do
              printf '%-16s ' "$f"
              ./goscheme "examples/$f.scm" > /dev/null && echo ok
            done
            ./goscheme examples/libraries/main.scm > /dev/null && echo "libraries        ok"
          else
            GOSCHEME=./goscheme ./examples/run-all.sh
          fi

  # The dynamic flavour is built where a C compiler for the platform exists:
  # the macOS runners have one, and so does the Windows runner.
  dynamic:
    name: dynamic ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-amd64, os: macos-13, out: goscheme-darwin-amd64-dynamic }
          - { name: darwin-arm64, os: macos-14, out: goscheme-darwin-arm64-dynamic }
          - { name: windows-amd64, os: windows-latest, out: goscheme-windows-amd64-dynamic.exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: build with cgo
        shell: bash
        run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o "${{ matrix.out }}" ./cmd/goscheme

      # The dynamic build is the one with the FFI, so the suite that covers it
      # has to pass here, on the platform it is being shipped for.
      - name: FFI suite
        shell: bash
        run: ./"${{ matrix.out }}" test/scheme/run-goscheme.scm | tail -1

      - name: features
        shell: bash
        run: ./"${{ matrix.out }}" -e "(display (features))" && echo

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

      # The Intel macOS runner is capacity constrained, so the same job also
      # cross-builds the Intel binary from the Apple Silicon one: the source is
      # identical and the SDK carries both slices.  The dedicated Intel job
      # still runs the suites natively when a runner is available.
      - name: cross-build the Intel binary
        if: matrix.name == 'darwin-arm64'
        shell: bash
        run: |
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags "-s -w" \
            -o goscheme-darwin-amd64-dynamic ./cmd/goscheme
          file goscheme-darwin-amd64-dynamic

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'darwin-arm64'
        with:
          name: goscheme-darwin-amd64-dynamic
          path: goscheme-darwin-amd64-dynamic
          if-no-files-found: error

  # Tagging is the whole release process.  The six static binaries are built
  # here on one Linux runner — the static flavour is CGO_ENABLED=0, so no cross
  # toolchain is involved — and the platforms themselves are exercised by the
  # test matrix above, on their own runners rather than under an emulator.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: build the six static binaries
        run: make dist DYNAMIC_PLATFORMS=

      # Run the artifact that actually ships, rather than trusting the
      # cross-build: the version must be the tag and the suites must pass
      # through the binary, not through `go test`.
      - name: smoke-test the shipped binary
        run: |
          set -e
          ./dist/goscheme-linux-amd64 --version
          ./dist/goscheme-linux-amd64 --version | grep -F "${GITHUB_REF_NAME#v}"
          ./dist/goscheme-linux-amd64 test/scheme/run-srfi-1.scm | tail -1
          ./dist/goscheme-linux-amd64 test/scheme/run-fast.scm | tail -1

      - name: attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          assets="dist/goscheme-linux-amd64 dist/goscheme-linux-arm64"
          assets="$assets dist/goscheme-darwin-amd64 dist/goscheme-darwin-arm64"
          assets="$assets dist/goscheme-windows-amd64.exe dist/goscheme-windows-arm64.exe"
          assets="$assets dist/SHA256SUMS"
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" $assets
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes $assets
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/goscheme-*
            dist/SHA256SUMS
          if-no-files-found: error
